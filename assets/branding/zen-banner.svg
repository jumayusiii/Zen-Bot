<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" role="img" aria-labelledby="zenBannerTitle zenBannerDesc">
  <title id="zenBannerTitle">Zen Discord bot banner</title>
  <desc id="zenBannerDesc">The Zen Z and ensō mark on an obsidian disc, centered in a quiet orbital field with no text.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1534" />
      <stop offset="0.4" stop-color="#0C1021" />
      <stop offset="0.72" stop-color="#070A15" />
      <stop offset="1" stop-color="#04060C" />
    </linearGradient>

    <radialGradient id="disc" cx="34%" cy="22%" r="92%">
      <stop offset="0" stop-color="#1D2647" />
      <stop offset="0.48" stop-color="#10172C" />
      <stop offset="0.82" stop-color="#090E1D" />
      <stop offset="1" stop-color="#060A14" />
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B39BFF" />
      <stop offset="0.48" stop-color="#756BFF" />
      <stop offset="0.76" stop-color="#5CE7FF" />
      <stop offset="1" stop-color="#9270FF" />
    </linearGradient>

    <linearGradient id="ring" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#F0ECFF" />
      <stop offset="0.32" stop-color="#A98CFF" />
      <stop offset="0.7" stop-color="#6D8DFF" />
      <stop offset="1" stop-color="#5CE7FF" />
    </linearGradient>

    <linearGradient id="z" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.55" stop-color="#F4F1FF" />
      <stop offset="1" stop-color="#C9BFEA" />
    </linearGradient>

    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E6BFF" stop-opacity="0" />
      <stop offset="0.22" stop-color="#A98CFF" stop-opacity="0.5" />
      <stop offset="0.72" stop-color="#6D8DFF" stop-opacity="0.5" />
      <stop offset="1" stop-color="#5CE7FF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CE7FF" stop-opacity="0" />
      <stop offset="0.35" stop-color="#7D7BFF" stop-opacity="0.18" />
      <stop offset="0.7" stop-color="#B39BFF" stop-opacity="0.12" />
      <stop offset="1" stop-color="#B39BFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="bloomA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#754CFF" stop-opacity="0.2" />
      <stop offset="1" stop-color="#754CFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bloomB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#31D9FF" stop-opacity="0.14" />
      <stop offset="1" stop-color="#31D9FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#61E8FF" stop-opacity="0.16" />
      <stop offset="0.55" stop-color="#6878FF" stop-opacity="0.05" />
      <stop offset="1" stop-color="#6878FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.48" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#02040A" stop-opacity="0.62" />
    </radialGradient>

    <filter id="discShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#01030A" flood-opacity="0.7" />
    </filter>

    <filter id="zGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="23" />
    </filter>
  </defs>

  <rect width="1500" height="600" fill="#04060C" />
  <rect width="1500" height="600" fill="url(#bg)" />

  <circle cx="170" cy="46" r="460" fill="url(#bloomA)" />
  <circle cx="1320" cy="566" r="440" fill="url(#bloomB)" />

  <rect x="80" y="299" width="1340" height="2" fill="url(#horizon)" />

  <ellipse cx="750" cy="300" rx="520" ry="204" fill="none" stroke="url(#orbit)" stroke-width="1.5" stroke-opacity="0.5" transform="rotate(-8 750 300)" />
  <ellipse cx="750" cy="300" rx="420" ry="166" fill="none" stroke="url(#orbit)" stroke-width="1.2" stroke-opacity="0.32" stroke-dasharray="3 12" transform="rotate(10 750 300)" />
  <ellipse cx="750" cy="300" rx="610" ry="248" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1.2" transform="rotate(-3 750 300)" />

  <circle cx="235" cy="372" r="4" fill="#B7A4FF" opacity="0.72" />
  <circle cx="1265" cy="228" r="3.5" fill="#9CF3FF" opacity="0.7" />
  <circle cx="1164" cy="373" r="3" fill="#A98CFF" opacity="0.62" />
  <circle cx="746" cy="548" r="2.5" fill="#9CF3FF" opacity="0.5" />

  <circle cx="750" cy="300" r="284" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5" />
  <circle cx="750" cy="300" r="244" fill="none" stroke="url(#ring)" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="2 14" />

  <circle cx="750" cy="300" r="248" fill="url(#halo)" />

  <g transform="translate(750 300) scale(0.42) translate(-512 -512)">
    <circle cx="512" cy="512" r="414" fill="url(#disc)" stroke="url(#rim)" stroke-opacity="0.58" stroke-width="3" filter="url(#discShadow)" />
    <circle cx="512" cy="512" r="398" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />
    <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-opacity="0.82" stroke-width="22" stroke-linecap="round" stroke-dasharray="1720 165" transform="rotate(-58 512 512)" />
    <circle cx="671" cy="258" r="8" fill="#9CF3FF" opacity="0.9" />
    <circle cx="671" cy="258" r="20" fill="#5CE7FF" opacity="0.12" />
    <path d="M 404 392 H 620 L 404 632 H 620" fill="none" stroke="#5CE7FF" stroke-opacity="0.2" stroke-width="112" stroke-linecap="round" stroke-linejoin="round" filter="url(#zGlow)" />
    <path d="M 404 392 H 620 L 404 632 H 620" fill="none" stroke="url(#z)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 424 370 H 596" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="4" stroke-linecap="round" />
  </g>

  <circle cx="342" cy="188" r="1.8" fill="#FFFFFF" opacity="0.45" />
  <circle cx="1192" cy="454" r="2.2" fill="#9CF3FF" opacity="0.5" />
  <circle cx="214" cy="452" r="1.6" fill="#B7A4FF" opacity="0.36" />
  <circle cx="1308" cy="148" r="1.8" fill="#FFFFFF" opacity="0.3" />

  <rect width="1500" height="600" fill="url(#vignette)" />
</svg>
