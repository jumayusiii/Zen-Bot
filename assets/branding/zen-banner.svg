<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" role="img" aria-labelledby="zenBannerTitle zenBannerDesc">
  <title id="zenBannerTitle">Zen banner</title>
  <desc id="zenBannerDesc">A rounded black Z on a raised white disc beside the ZEN wordmark on a black field.</desc>

  <defs>
    <radialGradient id="bannerHalo" cx="22%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2E2E2E" />
      <stop offset="0.6" stop-color="#121212" />
      <stop offset="1" stop-color="#000000" />
    </radialGradient>

    <linearGradient id="bannerDisc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.58" stop-color="#F5F5F5" />
      <stop offset="1" stop-color="#DEDEDE" />
    </linearGradient>

    <filter id="bannerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1500" height="600" fill="#000000" />
  <rect width="1500" height="600" fill="url(#bannerHalo)" />

  <circle
    cx="280"
    cy="300"
    r="206"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
    stroke-width="2"
  />

  <circle cx="280" cy="300" r="168" fill="url(#bannerDisc)" filter="url(#bannerShadow)" />

  <g transform="translate(3.5 23.5) scale(0.54)">
    <path
      d="M 356 356 H 668 L 356 668 H 668"
      fill="none"
      stroke="#000000"
      stroke-width="96"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <text
    x="1040"
    y="330"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Segoe UI, Arial, Helvetica, sans-serif"
    font-size="168"
    font-weight="700"
    letter-spacing="16"
  >ZEN</text>

  <line x1="880" y1="370" x2="1200" y2="370" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2" />

  <text
    x="1040"
    y="418"
    text-anchor="middle"
    fill="#A3A3A3"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="23"
    font-weight="600"
    letter-spacing="11"
  >DISCORD BOT</text>
</svg>
