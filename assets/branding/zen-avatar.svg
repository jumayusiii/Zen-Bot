<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="zenTitle zenDesc">
  <title id="zenTitle">Zen</title>
  <desc id="zenDesc">A rounded black Z on a raised white disc over a black field.</desc>

  <defs>
    <radialGradient id="zenHalo" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#333333" />
      <stop offset="0.62" stop-color="#141414" />
      <stop offset="1" stop-color="#000000" />
    </radialGradient>

    <linearGradient id="zenDisc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.58" stop-color="#F5F5F5" />
      <stop offset="1" stop-color="#DEDEDE" />
    </linearGradient>

    <filter id="zenShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#000000" />
  <rect width="1024" height="1024" fill="url(#zenHalo)" />

  <circle
    cx="512"
    cy="512"
    r="470"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
    stroke-width="2"
  />

  <circle cx="512" cy="512" r="356" fill="url(#zenDisc)" filter="url(#zenShadow)" />

  <path
    d="M 356 356 H 668 L 356 668 H 668"
    fill="none"
    stroke="#000000"
    stroke-width="96"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
