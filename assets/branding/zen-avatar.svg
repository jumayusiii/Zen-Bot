<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="zenTitle zenDesc">
  <title id="zenTitle">Zen bot icon</title>
  <desc id="zenDesc">A friendly white robot head with cyan eyes and a small Z badge on a deep indigo material gradient.</desc>

  <defs>
    <radialGradient id="matBg" cx="32%" cy="24%" r="92%">
      <stop offset="0" stop-color="#402C6E" />
      <stop offset="0.42" stop-color="#211C45" />
      <stop offset="0.78" stop-color="#111326" />
      <stop offset="1" stop-color="#070911" />
    </radialGradient>

    <linearGradient id="matRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A88BFF" />
      <stop offset="0.55" stop-color="#6B7DFF" />
      <stop offset="1" stop-color="#5CE7FF" />
    </linearGradient>

    <linearGradient id="matMark" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.58" stop-color="#F8F5FF" />
      <stop offset="1" stop-color="#DCD5F2" />
    </linearGradient>

    <linearGradient id="matEar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7D0EF" />
      <stop offset="1" stop-color="#9D91C8" />
    </linearGradient>

    <linearGradient id="matVisor" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#332A57" />
      <stop offset="0.6" stop-color="#1A1B39" />
      <stop offset="1" stop-color="#101326" />
    </linearGradient>

    <radialGradient id="matEye" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#E0FDFF" />
      <stop offset="0.28" stop-color="#8DF1FF" />
      <stop offset="0.68" stop-color="#29BDE8" />
      <stop offset="1" stop-color="#0A5D8D" />
    </radialGradient>

    <linearGradient id="matAntenna" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#81EDFF" />
      <stop offset="0.55" stop-color="#6A9DFF" />
      <stop offset="1" stop-color="#9B72FF" />
    </linearGradient>

    <linearGradient id="matAntennaLine" x1="512" y1="355" x2="512" y2="254" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B72FF" />
      <stop offset="0.55" stop-color="#6A9DFF" />
      <stop offset="1" stop-color="#81EDFF" />
    </linearGradient>

    <linearGradient id="matChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79E9FF" />
      <stop offset="1" stop-color="#8E6BFF" />
    </linearGradient>

    <radialGradient id="matGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#69E8FF" stop-opacity="0.26" />
      <stop offset="1" stop-color="#4B7DFF" stop-opacity="0" />
    </radialGradient>

    <filter id="matShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#02040A" flood-opacity="0.55" />
    </filter>

    <radialGradient id="matVignette" cx="50%" cy="46%" r="66%">
      <stop offset="0.52" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#04050A" stop-opacity="0.62" />
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="#070911" />
  <rect width="1024" height="1024" fill="url(#matBg)" />

  <circle cx="782" cy="760" r="430" fill="#42C8FF" opacity="0.1" />
  <circle cx="238" cy="224" r="350" fill="#9B76FF" opacity="0.13" />
  <circle cx="512" cy="512" r="392" fill="none" stroke="url(#matRing)" stroke-opacity="0.17" stroke-width="2" />
  <path d="M 826 300 A 360 360 0 1 1 806 738" fill="none" stroke="url(#matRing)" stroke-width="25" stroke-linecap="round" opacity="0.3" />

  <g fill="#FFFFFF" opacity="0.06">
    <rect x="144" y="644" width="88" height="34" rx="17" />
    <rect x="786" y="238" width="54" height="54" rx="18" />
    <circle cx="212" cy="344" r="7" />
    <circle cx="842" cy="604" r="5" />
  </g>

  <g transform="translate(0 25)">
    <g id="zenBotMark">
      <circle cx="512" cy="230" r="60" fill="url(#matGlow)" />
      <line x1="512" y1="355" x2="512" y2="254" stroke="url(#matAntennaLine)" stroke-width="14" stroke-linecap="round" />
      <circle cx="512" cy="230" r="30" fill="url(#matAntenna)" />
      <circle cx="502" cy="219" r="7" fill="#FFFFFF" opacity="0.78" />

      <rect x="232" y="455" width="84" height="150" rx="42" fill="url(#matEar)" />
      <rect x="708" y="455" width="84" height="150" rx="42" fill="url(#matEar)" />
      <rect x="252" y="486" width="42" height="90" rx="21" fill="#7E6EAD" opacity="0.42" />
      <rect x="730" y="486" width="42" height="90" rx="21" fill="#7E6EAD" opacity="0.42" />

      <rect x="292" y="355" width="440" height="330" rx="125" fill="url(#matMark)" filter="url(#matShadow)" />
      <rect x="292" y="355" width="440" height="330" rx="125" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" />
      <rect x="330" y="382" width="150" height="24" rx="12" fill="#FFFFFF" opacity="0.38" />

      <rect x="348" y="430" width="328" height="152" rx="66" fill="url(#matVisor)" />
      <rect x="348" y="430" width="328" height="152" rx="66" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2" />
      <rect x="366" y="446" width="292" height="50" rx="25" fill="#FFFFFF" opacity="0.045" />

      <rect x="406" y="460" width="70" height="88" rx="35" fill="#62E6FF" opacity="0.12" />
      <rect x="548" y="460" width="70" height="88" rx="35" fill="#62E6FF" opacity="0.12" />
      <rect x="414" y="468" width="54" height="72" rx="27" fill="url(#matEye)" />
      <rect x="556" y="468" width="54" height="72" rx="27" fill="url(#matEye)" />
      <rect x="426" y="481" width="13" height="24" rx="6.5" fill="#FFFFFF" opacity="0.82" />
      <rect x="568" y="481" width="13" height="24" rx="6.5" fill="#FFFFFF" opacity="0.82" />

      <rect x="382" y="608" width="42" height="18" rx="9" fill="#FF9AC8" opacity="0.16" />
      <rect x="600" y="608" width="42" height="18" rx="9" fill="#FF9AC8" opacity="0.16" />
      <path d="M 468 632 C 488 650 536 650 556 632" fill="none" stroke="#2B2449" stroke-width="12" stroke-linecap="round" />
      <path d="M 482 646 C 500 656 524 656 542 646" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.3" />

      <g transform="translate(494 378)">
        <rect width="36" height="36" rx="12" fill="url(#matChip)" />
        <path d="M 9 10 H 27 L 9 26 H 27" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  <rect width="1024" height="1024" fill="url(#matVignette)" />
</svg>
