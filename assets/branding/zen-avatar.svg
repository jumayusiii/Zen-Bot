<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="zenTitle zenDesc">
  <title id="zenTitle">Zen bot icon</title>
  <desc id="zenDesc">A luminous white Z inside an open ensō ring on an obsidian disc, with cyan and violet orbital accents.</desc>

  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="96%">
      <stop offset="0" stop-color="#35245F" />
      <stop offset="0.34" stop-color="#181B38" />
      <stop offset="0.68" stop-color="#0A0E1C" />
      <stop offset="1" stop-color="#05070D" />
    </radialGradient>

    <radialGradient id="disc" cx="34%" cy="22%" r="92%">
      <stop offset="0" stop-color="#1D2647" />
      <stop offset="0.48" stop-color="#10172C" />
      <stop offset="0.82" stop-color="#090E1D" />
      <stop offset="1" stop-color="#060A14" />
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B39BFF" />
      <stop offset="0.48" stop-color="#756BFF" />
      <stop offset="0.76" stop-color="#5CE7FF" />
      <stop offset="1" stop-color="#9270FF" />
    </linearGradient>

    <linearGradient id="ring" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#F0ECFF" />
      <stop offset="0.32" stop-color="#A98CFF" />
      <stop offset="0.7" stop-color="#6D8DFF" />
      <stop offset="1" stop-color="#5CE7FF" />
    </linearGradient>

    <linearGradient id="z" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.55" stop-color="#F4F1FF" />
      <stop offset="1" stop-color="#C9BFEA" />
    </linearGradient>

    <radialGradient id="bloomA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#754CFF" stop-opacity="0.25" />
      <stop offset="1" stop-color="#754CFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bloomB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#31D9FF" stop-opacity="0.18" />
      <stop offset="1" stop-color="#31D9FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#61E8FF" stop-opacity="0.13" />
      <stop offset="0.58" stop-color="#6878FF" stop-opacity="0.045" />
      <stop offset="1" stop-color="#6878FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="46%" r="66%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#02040A" stop-opacity="0.72" />
    </radialGradient>

    <filter id="discShadow" x="-35%" y="-35%" width="170%" height="175%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#01030A" flood-opacity="0.66" />
    </filter>

    <filter id="zGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="23" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#05070D" />
  <rect width="1024" height="1024" fill="url(#bg)" />

  <circle cx="254" cy="196" r="430" fill="url(#bloomA)" />
  <circle cx="790" cy="816" r="430" fill="url(#bloomB)" />

  <circle cx="512" cy="512" r="474" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1.5" />
  <circle cx="512" cy="512" r="444" fill="none" stroke="url(#rim)" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="2 14" />
  <path d="M 116 690 A 510 510 0 0 1 260 132" fill="none" stroke="url(#ring)" stroke-opacity="0.14" stroke-width="2.5" stroke-linecap="round" />

  <circle cx="512" cy="512" r="414" fill="url(#disc)" stroke="url(#rim)" stroke-opacity="0.58" stroke-width="2.5" filter="url(#discShadow)" />
  <circle cx="512" cy="512" r="398" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5" />
  <circle cx="512" cy="512" r="300" fill="url(#coreGlow)" />

  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-opacity="0.82" stroke-width="22" stroke-linecap="round" stroke-dasharray="1720 165" transform="rotate(-58 512 512)" />
  <circle cx="671" cy="258" r="8" fill="#9CF3FF" opacity="0.9" />
  <circle cx="671" cy="258" r="20" fill="#5CE7FF" opacity="0.12" />

  <path d="M 404 392 H 620 L 404 632 H 620" fill="none" stroke="#5CE7FF" stroke-opacity="0.2" stroke-width="112" stroke-linecap="round" stroke-linejoin="round" filter="url(#zGlow)" />
  <path d="M 404 392 H 620 L 404 632 H 620" fill="none" stroke="url(#z)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 424 370 H 596" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="4" stroke-linecap="round" />

  <circle cx="744" cy="318" r="5" fill="#9CF3FF" opacity="0.72" />
  <circle cx="282" cy="704" r="4" fill="#B7A4FF" opacity="0.7" />
  <circle cx="512" cy="512" r="352" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="2 17" />

  <rect width="1024" height="1024" fill="url(#vignette)" />
</svg>
