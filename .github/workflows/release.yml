name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Verify tag matches package version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag v$VERSION does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Build release notes from the changelog
        run: |
          node scripts/release-notes.js "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          args=(
            release create "$TAG"
            --verify-tag
            --title "Zen $TAG"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )

          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
